name: Move release tags (temporary)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/move-tags.yml'

permissions:
  contents: write

jobs:
  move-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move release tag to its version commit
        run: |
          git config user.name "6frizz"
          git config user.email "mattfabian2007@gmail.com"
          git tag -f 1.71.3 50987a8a1eaa8a755c6ecece02cd328cb9f40a19
          git push --force origin 1.71.3
      - name: Show resulting remote tag
        run: git ls-remote --tags origin '1.71.3'
