name: Move release tags (temporary)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/move-tags.yml'

permissions:
  contents: write

jobs:
  move-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move release tags to their version commits
        run: |
          git config user.name "6frizz"
          git config user.email "mattfabian2007@gmail.com"
          git tag -f 1.69.0 1a378adbe41a9004b8d0d045724c34da9166ef18
          git tag -f 1.71.1 914bae2f62c0e2e625abb00fe3ab2366b0a58191
          git tag -f 1.71.2 5ff7402b13468dab641330e3b8e8c3505d55a996
          git push --force origin 1.69.0 1.71.1 1.71.2
      - name: Show resulting remote tags
        run: git ls-remote --tags origin '1.69.0' '1.71.1' '1.71.2'
